name: page
on: { workflow_dispatch: { inputs: { url: { description: "url", required: true } } } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { URL: "${{ inputs.url }}" }
        run: |
          curl -sL -m 30 -A "Mozilla/5.0" "$URL" > page.html; wc -c page.html
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f page.html; git diff --cached --quiet || git commit -qm "page [skip ci]"; git pull -q --rebase || true; git push -q || true
