name: musebot   # single manual pass. The always-on bot is live.yml

on:
  workflow_dispatch: {}

permissions:
  contents: write            # needed to save bot/.state.json back to the repo

concurrency:
  group: musebot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: One pass
        env:
          MUSE_IDENTITY: ${{ secrets.MUSE_IDENTITY }}
          BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY || secrets.BANKR_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          set -o pipefail
          node bot/musebot.mjs run --live | tee bot/last-run.log
      - name: Save state
        run: |
          test -f bot/.state.json || exit 0
          git config user.name "musebot"
          git config user.email "musebot@users.noreply.github.com"
          git add -f bot/.state.json bot/last-run.log; test -f bot/mentions.log && git add -f bot/mentions.log
          git diff --cached --quiet || git commit -m "state [skip ci]"
          git push
