name: diag2
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/d.mjs <<'JS'
          import { writeFileSync } from "node:fs";
          const out = []; const j = async (u, b) => { const r = await fetch(u, b ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) } : {}); return r.json().catch(() => ({})); };
          const mp = await j("https://musepad.lol/api/tokens?sort=new");
          const list = mp.tokens ?? mp.data ?? mp.items ?? (Array.isArray(mp) ? mp : []);
          out.push(`musepad new: ${list.length} | top-level keys: ${Object.keys(mp).join(",")}`);
          out.push(`first item: ${JSON.stringify(list[0] ?? {}).slice(0, 1500)}`);
          out.push(`second item keys: ${Object.keys(list[1] ?? {}).join(",")}`);
          const t = list[0]?.address ?? list[0]?.token_address ?? list[0]?.tokenAddress ?? list[0]?.contract;
          if (t) {
            const one = await j(`https://musepad.lol/api/token/${t}`); out.push(`token detail: ${JSON.stringify(one).slice(0, 1200)}`);
            const RPC = "https://rpc.mainnet.chain.robinhood.com"; const TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
            const head = parseInt((await j(RPC, { jsonrpc: "2.0", id: 1, method: "eth_blockNumber", params: [] })).result, 16);
            for (const span of [30000, 200000, 900000]) {
              const lg = await j(RPC, { jsonrpc: "2.0", id: 1, method: "eth_getLogs", params: [{ address: t, topics: [TRANSFER], fromBlock: "0x" + Math.max(0, head - span).toString(16), toBlock: "latest" }] });
              out.push(`getLogs span ${span}: ${lg.error ? "ERR " + JSON.stringify(lg.error).slice(0,200) : lg.result.length + " transfers"}`);
              if (lg.result?.length) { const cp = {}; for (const l of lg.result) { const f = "0x" + l.topics[1].slice(26), to = "0x" + l.topics[2].slice(26); cp[f] = (cp[f] ?? 0) + 1; cp[to] = (cp[to] ?? 0) + 1; } out.push("  top counterparties: " + Object.entries(cp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([a,n])=>a+":"+n).join(" ")); out.push("  first log block " + parseInt(lg.result[0].blockNumber,16) + " tx " + lg.result[0].transactionHash.slice(0,12)); }
            }
            const ds = await j(`https://api.dexscreener.com/tokens/v1/robinhood/${t}`);
            out.push(`dexscreener pairs: ${Array.isArray(ds) ? ds.length : "?"} ${JSON.stringify((ds??[])[0]?.quoteToken ?? {})} liq ${(ds??[])[0]?.liquidity?.usd}`);
          }
          writeFileSync("diag2.log", out.join("\n") + "\n"); console.log(out.join("\n"));
          JS
          node /tmp/d.mjs
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f diag2.log; git diff --cached --quiet || git commit -qm "diag2 [skip ci]"; git pull -q --rebase || true; git push -q || true
