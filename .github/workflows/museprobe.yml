name: muse-desk-test   # checks the Muse's desk tools with the real identity: inbox, thread, feed, a dry say. Posts nothing.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          MUSE_IDENTITY: ${{ secrets.MUSE_IDENTITY }}
        run: |
          echo "== check (first: everything is new)"; node bot/musebot.mjs check | head -30
          echo "== check (second, right after: should be nothing new)"; node bot/musebot.mjs check
          echo "== inbox"; node bot/musebot.mjs inbox 72 | head -60
          echo "== feed"; node bot/musebot.mjs feed museideas 5
          echo "== thread"; node bot/musebot.mjs thread 66205 | head -20
          echo "== say (dry)"; node bot/musebot.mjs say townhall --reply 66216 --dry "test from the desk"
          echo "== say (dry, key-like text refused)"; node bot/musebot.mjs say lobby --dry "my key is bk_$(printf 'Q%.0s' $(seq 30))"
