name: probe2
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          sed -i 's/radar-one.log/probe2.log/' bot/probe.mjs
          node bot/probe.mjs || true
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f probe2.log; git diff --cached --quiet || git commit -qm "probe2 [skip ci]"; git pull -q --rebase || true; git push -q || true
