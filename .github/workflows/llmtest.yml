name: llm-test   # checks the LLM key and the configured model. Writes model ids and one short reply to llm-test.log (never the key).
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY || secrets.BANKR_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          cat > /tmp/t.mjs <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const cfg = JSON.parse(readFileSync("bot/config.json", "utf8")).llm;
          const out = [];
          for (const p of cfg.providers) {
            const key = process.env[p.keyEnv];
            if (!key) { out.push(`${p.name}: no key in ${p.keyEnv}`); continue; }
            const H = { "Content-Type": "application/json", Authorization: `Bearer ${key}`, ...(p.referer ? { "HTTP-Referer": p.referer, "X-Title": "pretrade" } : {}) };
            const t0 = Date.now();
            const r = await fetch(`${p.baseUrl}/chat/completions`, { method: "POST", headers: H, body: JSON.stringify({ model: p.model, max_tokens: cfg.maxTokens, temperature: 0.2, messages: [{ role: "user", content: "Reply with exactly: pretrade analyst online" }] }) });
            const j = await r.json().catch(() => ({}));
            out.push(`${p.name} (${p.model}) → HTTP ${r.status} in ${Date.now() - t0}ms | reply: ${String(j.choices?.[0]?.message?.content ?? JSON.stringify(j).slice(0, 200)).slice(0, 120)} | served: ${j.model ?? "?"} | cost: ${j.usage?.cost ?? "n/a"}`);
          }
          // which models this key can reach on the Bankr gateway, and what each costs (ids and prices only)
          const bk = process.env.BANKR_LLM_KEY;
          if (bk) {
            const m = await fetch("https://llm.bankr.bot/v1/models", { headers: { Authorization: `Bearer ${bk}` } });
            const j = await m.json().catch(() => ({}));
            out.push(`--- bankr /v1/models → HTTP ${m.status}`);
            for (const x of j.data ?? []) out.push(`${x.id} | ${JSON.stringify(x.pricing ?? x.price ?? x.cost ?? {}).slice(0, 160)}${x.free !== undefined ? ` | free=${x.free}` : ""}`);
            if (!(j.data ?? []).length) out.push(JSON.stringify(j).slice(0, 400));
            for (const path of ["/v1/credits", "/v1/usage", "/v1/me", "/v1/key"]) {
              const r = await fetch(`https://llm.bankr.bot${path}`, { headers: { Authorization: `Bearer ${bk}` } }).catch(() => null);
              // field names only: account details (balances, wallets) stay out of the public log
              const b = r ? await r.json().catch(() => null) : null;
              out.push(`bankr ${path} → ${r ? `HTTP ${r.status} fields: ${b && typeof b === "object" ? Object.keys(b).join(", ") : "(not json)"}` : "no answer"}`);
            }
          }
          writeFileSync("llm-test.log", out.join("\n") + "\n"); console.log(out.join("\n"));
          JS
          node /tmp/t.mjs || true
          echo '--- realistic analyst note' >> llm-test.log
          MUSE_IDENTITY='{"public_key":"x","secret":"y","muse_id":"muse_x"}' node bot/musebot.mjs note-test >> llm-test.log 2>&1 || true
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f llm-test.log; git diff --cached --quiet || git commit -qm "llm test [skip ci]"; git push
