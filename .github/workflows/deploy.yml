name: bankr-deploy   # deploys x402/ services to Bankr x402 Cloud, then switches the musebook bot on

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BANKR_API_KEY: ${{ secrets.BANKR_API_KEY }}
      BANKR_NOT_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secret
        run: test -n "$BANKR_API_KEY" || { echo "Add the BANKR_API_KEY repository secret first."; exit 1; }
      - name: Offline tests
        run: npm install --no-audit --no-fund && npm test && npm run typecheck
      - name: Install Bankr CLI
        run: npm install -g @bankr/cli
      - name: Deploy
        run: |
          set -o pipefail
          { echo "== wallet"; bankr whoami 2>&1 | grep -E "EVM" || echo "(whoami not permitted for this key, continuing)"; } | tee deploy.log
          # one service per request: all five in one upload is over the API's size limit (HTTP 413)
          for svc in $(ls x402 | grep -v '^_'); do
            test -f "x402/$svc/index.ts" || continue
            { echo "== deploy $svc"; bankr x402 deploy "$svc"; } 2>&1 | tee -a deploy.log
          done
          { echo "== list"; bankr x402 list || true; } 2>&1 | tee -a deploy.log
      - name: Save deploy log (URLs only, no secrets)
        if: always()
        run: |
          test -f deploy.log || exit 0
          sed -i -E 's/bk_[A-Za-z0-9_-]+/bk_***/g' deploy.log
          git config user.name "musebot"; git config user.email "musebot@users.noreply.github.com"
          git add -f deploy.log; git diff --cached --quiet || git commit -qm "deploy log [skip ci]"; git push
      - name: Switch the bot on only if the live URLs match bot/config.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(node -p "require('./bot/config.json').endpointBase.toLowerCase()")
          if grep -qi "$BASE" deploy.log; then
            gh workflow enable musebot.yml && echo "bot enabled"
          else
            echo "::warning::Deployed wallet address differs from bot/config.json. Bot left OFF. Fix endpointBase, then enable the musebot workflow."
          fi
