name: radar-dry
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { MUSE_IDENTITY: "${{ secrets.MUSE_IDENTITY }}" }
        run: |
          node bot/musebot.mjs radar --dry > radar-dry.log 2>&1 || true
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f radar-dry.log; git diff --cached --quiet || git commit -qm "radar dry [skip ci]"; git pull -q --rebase || true; git push -q || true
