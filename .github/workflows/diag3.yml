name: diag3
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          cat > /tmp/d.mjs <<'JS'
          import { writeFileSync } from "node:fs";
          const out = []; const j = async (u, b) => { const r = await fetch(u, b ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) } : {}); return r.json().catch(() => ({})); };
          const RPC = "https://rpc.mainnet.chain.robinhood.com"; const TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
          const items = [];
          for (let p = 1; p <= 5; p++) { const r = await j(`https://musepad.lol/api/tokens?sort=new&page=${p}`); items.push(...(r.items ?? [])); }
          out.push(`musepad total items fetched: ${items.length}; newest ${items[0]?.launchedAt}; oldest ${items[items.length-1]?.launchedAt}`);
          const hot = await j(`https://musepad.lol/api/tokens?sort=volume`);
          out.push(`by volume: ${(hot.items ?? []).slice(0,8).map(x => `${x.symbol}($${Math.round(x.volume24hUsd??0)}, mc $${Math.round(x.marketCapUsd??0)}, ${x.launchedAt?.slice(5,16)})`).join(" | ")}`);
          const head = parseInt((await j(RPC, { jsonrpc: "2.0", id: 1, method: "eth_blockNumber", params: [] })).result, 16);
          for (const sym of ["WREN", "AZUKI", (hot.items ?? [])[0]?.symbol]) {
            const it = [...items, ...(hot.items ?? [])].find(x => x.symbol === sym); if (!it) { out.push(`${sym}: not in list`); continue; }
            const t = it.contractAddress;
            for (const span of [60000, 20000, 5000]) {
              const r = await j(RPC, { jsonrpc: "2.0", id: 1, method: "eth_getLogs", params: [{ address: t, topics: [TRANSFER], fromBlock: "0x" + (head - span).toString(16), toBlock: "latest" }] });
              out.push(`${sym} ${t.slice(0,10)} last ${span} blocks: ${r.error ? "ERR " + JSON.stringify(r.error).slice(0,180) : r.result.length + " logs"}`);
              if (!r.error) break;
            }
            const all = await j(RPC, { jsonrpc: "2.0", id: 1, method: "eth_getLogs", params: [{ address: t, topics: [TRANSFER], fromBlock: "0x0", toBlock: "latest" }] });
            out.push(`  from genesis: ${all.error ? "ERR " + JSON.stringify(all.error).slice(0,200) : all.result.length + " logs"}`);
            if (all.result?.length) { const cp = {}; for (const l of all.result) { for (const a of ["0x"+l.topics[1].slice(26), "0x"+l.topics[2].slice(26)]) cp[a] = (cp[a]??0)+1; } out.push("  top counterparties: " + Object.entries(cp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([a,n])=>a.slice(0,12)+":"+n).join(" ")); out.push(`  first block ${parseInt(all.result[0].blockNumber,16)} vs head ${head}`); }
            const g = await j(`https://api.gopluslabs.io/api/v1/token_security/4663?contract_addresses=${t}`);
            const x = g.result?.[t.toLowerCase()]; out.push(`  goplus holder_count ${x?.holder_count} holders ${JSON.stringify((x?.holders??[]).slice(0,3)).slice(0,300)}`);
          }
          writeFileSync("diag3.log", out.join("\n") + "\n"); console.log(out.join("\n"));
          JS
          node /tmp/d.mjs
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f diag3.log; git diff --cached --quiet || git commit -qm "diag3 [skip ci]"; git pull -q --rebase || true; git push -q || true
