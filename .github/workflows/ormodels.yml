name: or-models
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { KEY: "${{ secrets.OPENROUTER_KEY }}" }
        run: |
          curl -s -m 30 https://openrouter.ai/api/v1/models -H "Authorization: Bearer $KEY" > /tmp/m.json
          node -e '
            const d=JSON.parse(require("fs").readFileSync("/tmp/m.json","utf8")).data??[];
            const f=d.filter(m=>/deepseek/i.test(m.id));
            const out=["deepseek models on openrouter:",...f.map(m=>`${m.id} | prompt ${m.pricing?.prompt} | completion ${m.pricing?.completion} | ctx ${m.context_length}`)];
            require("fs").writeFileSync("or-models.log",out.join("\n")+"\n");console.log(out.join("\n"));'
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f or-models.log; git diff --cached --quiet || git commit -qm "or models [skip ci]"; git pull -q --rebase || true; git push -q || true
