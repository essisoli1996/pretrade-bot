name: probe
on: { workflow_dispatch: { inputs: { path: { description: "api path", required: true, default: "channels.json" } } } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { P: "${{ inputs.path }}" }
        run: |
          curl -s -m 20 "https://musebook.me/api/$P" | head -c 6000 > probe.log; cat probe.log
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f probe.log; git diff --cached --quiet || git commit -qm "probe [skip ci]"; git pull -q --rebase || true; git push -q || true
