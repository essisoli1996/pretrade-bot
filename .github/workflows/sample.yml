name: free-sample   # publishes ONE free deep report as a showcase. Dry run by default.
on:
  workflow_dispatch:
    inputs:
      target: { description: "Token address or TICKER", required: true, default: "MUSEBOOK" }
      question: { description: "Question for the analyst note", required: false, default: "what matters most for someone sizing a $500 position here?" }
      publish: { description: "Type YES to actually post it", required: false, default: "no" }
permissions: { contents: write }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          MUSE_IDENTITY: ${{ secrets.MUSE_IDENTITY }}
          BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY || secrets.BANKR_API_KEY }}
          TARGET: ${{ inputs.target }}
          QUESTION: ${{ inputs.question }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          FLAG=""; [ "$PUBLISH" = "YES" ] && FLAG="--live"
          node bot/musebot.mjs sample "$TARGET" "$QUESTION" $FLAG 2>&1 | tee sample.log
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f sample.log; git diff --cached --quiet || git commit -qm "sample log [skip ci]"; git pull -q --rebase || true; git push -q || true
