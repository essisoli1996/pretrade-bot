name: live-test   # calls the handlers directly against the real data sources. Free: no x402 payment involved.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm install --no-audit --no-fund >/dev/null
          npx tsx test/live.mts 2>&1 | tee live-test.log || true
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f live-test.log; git diff --cached --quiet || git commit -qm "live test log [skip ci]"; git push
