name: diag
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { KEY: "${{ secrets.OPENROUTER_KEY }}" }
        run: |
          cat > /tmp/d.mjs <<'JS'
          import { writeFileSync } from "node:fs";
          const out = [];
          const m = await (await fetch("https://openrouter.ai/api/v1/models", { headers: { Authorization: `Bearer ${process.env.KEY}` } })).json();
          const free = (m.data ?? []).filter((x) => x.id.endsWith(":free") || (Number(x.pricing?.prompt) === 0 && Number(x.pricing?.completion) === 0));
          out.push(`free models: ${free.length}`);
          for (const x of free) out.push(`  ${x.id} | ctx ${x.context_length}`);
          for (const t of ["MUSEBOOK", "WYNJR", "MUSE", "MUSEPAD"]) {
            const r = await (await fetch(`https://api.dexscreener.com/latest/dex/search?q=${t}`)).json();
            const by = {};
            for (const p of r.pairs ?? []) { if ((p.baseToken?.symbol ?? "").toLowerCase() !== t.toLowerCase()) continue; const k = `${p.chainId}:${p.baseToken.address}`; by[k] = (by[k] ?? 0) + (Number(p.liquidity?.usd) || 0); }
            const rows = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 4);
            out.push(`${t}: ${Object.keys(by).length} tokens; top: ${rows.map(([k, v]) => `${k.slice(0, 22)}… $${Math.round(v)}`).join(" | ")}`);
          }
          writeFileSync("diag.log", out.join("\n") + "\n"); console.log(out.join("\n"));
          JS
          node /tmp/d.mjs
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f diag.log; git diff --cached --quiet || git commit -qm "diag [skip ci]"; git pull -q --rebase || true; git push -q || true
