name: v4-hooks   # read-only diagnostics: v4 hooks, or the full check incl. a real buy+sell simulation. Posts nothing, needs no secrets.
on:
  workflow_dispatch:
    inputs:
      addresses: { description: "Token addresses, space separated (empty = trading musepad tokens + the ledger)", required: false, default: "" }
      command: { description: "hooks, simulate (bot), or endpoints (paid handlers run locally, no payment)", required: false, default: "hooks", type: choice, options: [hooks, simulate, endpoints] }
permissions: { contents: write }
jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          ADDRS: ${{ inputs.addresses }}
          CMD: ${{ inputs.command || 'hooks' }}
        run: |
          if [ "$CMD" = "endpoints" ]; then npm install --no-audit --no-fund >/dev/null 2>&1; npx tsx test/live-v4.mts $ADDRS 2>&1 | tee hooks.log
          else node bot/musebot.mjs "$CMD" $ADDRS 2>&1 | tee hooks.log; fi
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f hooks.log; git diff --cached --quiet || git commit -qm "hooks log [skip ci]"; git pull -q --rebase || true; git push -q || true
