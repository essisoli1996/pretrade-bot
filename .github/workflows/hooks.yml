name: v4-hooks   # read-only diagnostics: v4 hooks, or the full check incl. a real buy+sell simulation. Posts nothing, needs no secrets.
on:
  workflow_dispatch:
    inputs:
      addresses: { description: "Token addresses, space separated (empty = trading musepad tokens + the ledger)", required: false, default: "" }
      command: { description: "hooks, simulate (bot), endpoints (paid handlers run locally, no payment), signprobe (pre-signing simulation per chain)", required: false, default: "hooks", type: choice, options: [hooks, simulate, endpoints, signprobe, fetch, try, launchreport, talkscan, townscan, convprobe, provscan, openerprobe, sentinelscan, phishprobe, rpcprobe, codeat, source] }
permissions: { contents: write }
jobs:
  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          ADDRS: ${{ inputs.addresses }}
          CMD: ${{ inputs.command || 'hooks' }}
          # model keys only, for convprobe (what the conversation model would say); never the bot's identity
          BANKR_LLM_KEY: ${{ secrets.BANKR_LLM_KEY || secrets.BANKR_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # read-only data keys (GitHub masks them in logs; the bot redacts them too)
          NODEFLARE_KEY: ${{ secrets.NODEFLARE_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
        run: |
          if [ "$CMD" = "fetch" ]; then
            # research helper: prints public pages/APIs to the job log only (nothing is committed)
            for u in $ADDRS; do echo "===== $u"; curl -sSL -m 20 -A "Mozilla/5.0" "$u" | sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 20000; echo; done
            exit 0
          fi
          if [ "$CMD" = "townscan" ]; then node scripts/townscan.mjs $ADDRS > townscan.txt 2>&1; echo "digest: $(wc -c < townscan.txt) bytes"
            # research data goes to a throwaway branch, never main
            git config user.name musebot; git config user.email musebot@users.noreply.github.com
            git checkout -q --orphan research; git rm -rqf --cached .; git add -f townscan.txt; git commit -qm "town digest [skip ci]"; git push -qf origin research; fi
          if [ "$CMD" = "townscan" ]; then exit 0; fi
          if [ "$CMD" = "try" ]; then
            # addresses input holds commands separated by ";", e.g. "stock TSLA; plan 0x… 250"
            IFS=';' read -ra CMDS <<< "$ADDRS"; for c in "${CMDS[@]}"; do echo "===== try: $c"; node bot/musebot.mjs try $c 2>&1; echo; done | tee hooks.log
          elif [ "$CMD" = "endpoints" ]; then npm install --no-audit --no-fund >/dev/null 2>&1; { npx tsx test/live-v4.mts $ADDRS; npx tsx test/live-new.mts; } 2>&1 | tee hooks.log
          else node bot/musebot.mjs "$CMD" $ADDRS 2>&1 | tee hooks.log; fi
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f hooks.log; git diff --cached --quiet || git commit -qm "hooks log [skip ci]"; git pull -q --rebase || true; git push -q || true
