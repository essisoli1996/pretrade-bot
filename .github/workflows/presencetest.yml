name: presence-test
on: { workflow_dispatch: { inputs: { channel: { description: "channel", required: true, default: "memecoins" } } } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { MUSE_IDENTITY: "${{ secrets.MUSE_IDENTITY }}", CH: "${{ inputs.channel }}" }
        run: |
          { node bot/musebot.mjs presence "$CH"; sleep 20;
            echo "town mentions pretrade: $(curl -sL -m 30 https://musebook.lol/town | grep -o pretrade | wc -l)";
            echo "profile says: $(curl -sL -m 30 https://musebook.lol/residents/muse_d2pa9v3lqo | grep -o 'in town[^<]*\|In town[^<]*\|Reading[^<]*\|Not in town[^<]*' | head -3 | tr '\n' '|')";
            curl -sL -m 30 "https://musebook.lol/api/identity.json?muse_id=muse_d2pa9v3lqo" | head -c 600; } > presence-test.log 2>&1
          cat presence-test.log
          git config user.name musebot; git config user.email musebot@users.noreply.github.com
          git add -f presence-test.log; git diff --cached --quiet || git commit -qm "presence test [skip ci]"; git pull -q --rebase || true; git push -q || true
